<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Entries — CharlotteTest Funding</title>
<style>
/* ============================================================
   Vitesse Design System — Colors & Type (inlined for self-contained hosting)
   Source: Vitesse Visual Identity Guidelines, v1.0 (2025)
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

:root {
  /* ---------- Brand colors (HEX from guidelines pp. 28–29) ---------- */
  --color-blue-green:    #003342;
  --color-dark-purple:   #470A68;
  --color-purple:        #831FBF;
  --color-vivid-purple:  #B029FF;
  --color-light-purple:  #CF7FFF;
  --color-warm-orange:   #F15B40;
  --color-light-orange:  #FD9352;
  --color-pastel-purple: #B49EB5;
  --color-off-white:     #F5F5F5;
  --color-black:         #0A0A0A;

  --bg-canvas:        var(--color-off-white);
  --bg-canvas-dark:   var(--color-black);
  --bg-surface:       #FFFFFF;
  --bg-surface-dark:  #141014;
  --bg-tinted:        #EDE7EE;
  --bg-deep:          var(--color-dark-purple);

  --fg-1:             var(--color-black);
  --fg-2:             #3C3640;
  --fg-3:             #6B6470;
  --fg-on-dark-1:     var(--color-off-white);
  --fg-on-dark-2:     #C9BFCD;
  --fg-on-dark-3:     var(--color-pastel-purple);

  --fg-link:          var(--color-purple);
  --fg-link-hover:    var(--color-dark-purple);
  --fg-accent:        var(--color-warm-orange);

  --border-hairline:  rgba(10, 10, 10, 0.08);
  --border-default:   rgba(10, 10, 10, 0.14);
  --border-strong:    rgba(10, 10, 10, 0.32);
  --border-on-dark:   rgba(245, 245, 245, 0.16);

  --status-success:   #1F8A5B;
  --status-warning:   #FD9352;
  --status-danger:    #F15B40;
  --status-info:      #2E5BFF;

  /* ---------- Type ---------- */
  --font-display:  "Gellix", "Poppins", "Inter", system-ui, -apple-system, sans-serif;
  --font-body:     "Gellix", "Poppins", "Inter", system-ui, -apple-system, sans-serif;
  --font-system:   "Poppins", "Gellix", system-ui, sans-serif;
  --font-mono:     "Poppins", "Gellix", system-ui, sans-serif;

  --fw-light:    300;
  --fw-regular:  400;
  --fw-medium:   500;
  --fw-bold:     700;

  --tracking-display:  -0.05em;
  --tracking-tight:    -0.025em;
  --tracking-body:     -0.01em;
  --tracking-wide:     0.04em;

  --leading-tight:  1.05;
  --leading-snug:   1.2;
  --leading-normal: 1.45;
  --leading-loose:  1.6;

  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-pill: 999px;

  --focus-ring-color: rgba(131, 31, 191, 0.55);
  --focus-ring-width: 2px;
  --focus-ring-offset: 2px;
}
::selection { background: var(--color-vivid-purple); color: var(--color-off-white); }
</style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #FFFFFF; }
  body {
    font-family: var(--font-body);
    color: var(--fg-1);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
  }

  .page {
    max-width: 1640px;
    margin: 0 auto;
    padding: 28px 40px 48px;
  }

  /* ---------- Breadcrumb ---------- */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--fg-3);
    letter-spacing: -0.005em;
    margin-bottom: 20px;
  }
  .breadcrumb a { color: var(--fg-3); }
  .breadcrumb a:hover { color: var(--fg-1); text-decoration: none; }
  .breadcrumb .sep { color: var(--color-light-purple); display: inline-flex; }
  .breadcrumb .current { color: var(--color-purple); font-weight: 500; }

  /* ---------- Title row ---------- */
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 28px;
  }
  .title-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .back-btn {
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: none; cursor: pointer;
    color: var(--color-purple);
    border-radius: var(--radius-sm);
  }
  .back-btn:hover { background: rgba(131,31,191,.06); }
  .page-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.025em;
    margin: 0;
    color: var(--fg-1);
  }

  .btn-primary {
    background: var(--color-dark-purple);
    color: var(--color-off-white);
    border: none;
    border-radius: var(--radius-md);
    padding: 13px 22px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: background .18s cubic-bezier(.4,0,.2,1);
  }
  .btn-primary:hover { background: #380851; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 22px;
  }
  .search {
    position: relative;
    flex: 0 1 420px;
  }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--fg-3); }
  .search input {
    width: 100%;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-pill);
    padding: 12px 18px 12px 44px;
    font-family: var(--font-body);
    font-size: 14px;
    letter-spacing: -0.005em;
    color: var(--fg-1);
    background: #FFFFFF;
    outline: none;
    transition: border-color .18s;
  }
  .search input::placeholder { color: var(--fg-3); }
  .search input:focus { border-color: var(--color-purple); }

  .tool-actions { display: flex; align-items: center; gap: 12px; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border-default);
    background: #FFFFFF;
    border-radius: var(--radius-pill);
    padding: 10px 18px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: var(--fg-1);
    cursor: pointer;
    transition: border-color .18s, background .18s;
  }
  .pill-btn:hover { border-color: var(--border-strong); }
  .pill-btn svg { color: var(--fg-2); }

  /* ---------- Table ---------- */
  .table-card {
    border-top: 1px solid var(--border-hairline);
    border-bottom: 1px solid var(--border-hairline);
    overflow-x: hidden;
  }
  table.entries {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.entries th {
    text-align: left;
    padding: 16px 18px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--fg-1);
    border-bottom: 1px solid var(--border-default);
    white-space: normal;
    vertical-align: middle;
  }
  .th-inner { display: inline-flex; align-items: center; gap: 8px; width: 100%; }
  .th-inner.right { justify-content: flex-end; }
  .sort-ico { color: #B9B2BF; flex-shrink: 0; align-self: center; }

  /* proportional column widths — table fits the container, no horizontal scroll */
  /* data columns share the width equally; the action column fits its icon */
  table.entries col.c-edit { width: 60px; }
  table.entries col.c-cd   { width: 100px; }
  table.entries td.td-cd { overflow: visible; text-overflow: clip; padding: 0 14px; }
  table.entries col.c-amt  { width: 10%; }
  table.entries col.c-type { width: 12.5%; }
  table.entries td.td-action { overflow: visible; text-overflow: clip; text-align: center; padding: 0 8px; }

  .tbody-clip { overflow: hidden; }

  table.entries td {
    padding: 0 18px;
    height: 56px;
    font-size: 13.5px;
    letter-spacing: -0.005em;
    color: var(--fg-1);
    border-bottom: 1px solid var(--border-hairline);
    vertical-align: middle;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: #FFFFFF;
    font-variant-numeric: tabular-nums;
  }
  td.right { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--fg-3); }
  .neg { color: #C2402A; font-weight: 500; }
  .pos { color: #1F8A5B; font-weight: 500; }

  .tag {
    display: inline-flex; align-items: center;
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .tag.debit  { background: rgba(241,91,64,.10);  color: #C2402A; }
  .tag.credit { background: rgba(31,138,91,.10);   color: #1F8A5B; }

  .edit-btn {
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--color-purple);
    border-radius: var(--radius-sm);
    color: var(--color-purple);
    background: #FFFFFF;
    cursor: pointer;
    transition: background .18s;
  }
  .edit-btn:hover { background: rgba(131,31,191,.07); }

  /* ---------- Row animation ---------- */
  .tbody-clip tbody { display: table-row-group; }
  tr.entry-row { will-change: transform, opacity; }
  tr.entering td { opacity: 0; }

  /* ---------- Annotation typewriter ---------- */
  .annot-caret {
    display: inline-block;
    width: 1px;
    height: 1.05em;
    background: var(--color-purple);
    margin-left: 1px;
    vertical-align: -2px;
    animation: annot-blink 1s steps(1) infinite;
  }
  @keyframes annot-blink { 50% { opacity: 0; } }

  /* ---------- Muted (display-only) controls ---------- */
  /* Search, Filter/Customise, the primary button and the row edit button are
     inert in the embed: non-interactive, no hover. */
  .toolbar .search,
  .toolbar .pill-btn,
  .title-row .btn-primary,
  .edit-btn {
    pointer-events: none;
    cursor: default;
  }
  .edit-btn:hover { background: #FFFFFF; }
</style>
</head>
<body>
  <div class="page">
    <!-- Breadcrumb -->
    <nav class="breadcrumb">
      <span>Home</span>
      <span class="sep">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </span>
      <span>Accounts</span>
      <span class="sep">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </span>
      <span class="current">Entries</span>
    </nav>

    <!-- Title -->
    <div class="title-row">
      <div class="title-left">
        <button class="back-btn" aria-label="Back">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <h1 class="page-title"><span style="color: #831fbf"><span style="color: #000000">Certex Consumer Warranty (USD)</span></span></h1>
      </div>
      <button class="btn-primary">View account properties</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="Search by Reference">
      </div>
      <div class="tool-actions">
        <button class="pill-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          Filter
        </button>
        <button class="pill-btn">Customise</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <table class="entries">
        <colgroup>
          <col class="c-cd"><col class="c-amt"><col class="c-type"><col class="c-created">
          <col class="c-bal"><col class="c-pay"><col class="c-claims"><col class="c-other">
          <col class="c-narr"><col class="c-annot"><col class="c-edit">
        </colgroup>
        <thead>
          <tr>
            <th></th>
            <th><span class="th-inner">Amount <span class="sort-ico" data-sort></span></span></th>
            <th><span class="th-inner">Entry Type <span class="sort-ico" data-sort></span></span></th>
            <th><span class="th-inner">Date
</span></th>
            <th><span class="th-inner">Balance <span class="sort-ico" data-sort></span></span></th>
            <th><span class="th-inner">Payment Reference <span class="sort-ico" data-sort></span></span></th>
            <th><span class="th-inner">Claims Reference <span class="sort-ico" data-sort></span></span></th>
            <th><span class="th-inner">Claimant Reference <span class="sort-ico" data-sort></span></span></th>
            <th><span class="th-inner">Narrative <span class="sort-ico" data-sort></span></span></th>
            <th><span class="th-inner">Annotation <span class="sort-ico" data-sort></span></span></th>
            <th></th>
          </tr>
        </thead>
      </table>
      <div class="tbody-clip">
        <table class="entries">
          <colgroup>
            <col class="c-cd"><col class="c-amt"><col class="c-type"><col class="c-created">
            <col class="c-bal"><col class="c-pay"><col class="c-claims"><col class="c-other">
            <col class="c-narr"><col class="c-annot"><col class="c-edit">
          </colgroup>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
(function () {
  var VISIBLE = 10;
  var ROW_H = 56;

  var sortSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4"/><path d="M8 15l4 4 4-4"/></svg>';
  document.querySelectorAll('[data-sort]').forEach(function (el) { el.innerHTML = sortSvg; });

  var editSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>';

  // ---- seed data (Payment 80% / Return 10% / Liquidity 10%) ----
  var seed = [
    {cd:'Debit',  amt:-150.45, type:'Payment',   created:'17/02/2026', bal:9997.55, pay:'P4471', claims:'C-ABC-4471', claimant:'POLABC-4471', narr:'Screen repair claim', annot:null},
    {cd:'Debit',  amt:-148.20, type:'Payment',   created:'17/02/2026', bal:10148.00, pay:'P8213', claims:'C-KMD-8213', claimant:'POLKMD-8213', narr:'Battery replacement', annot:null},
    {cd:'Debit',  amt:-152.46, type:'Payment',   created:'16/02/2026', bal:10296.20, pay:'P5521', claims:'C-TVL-5521', claimant:'POLTVL-5521', narr:'Laptop repair', annot:null},
    {cd:'Credit', amt:1020.00, type:'Liquidity', created:'14/02/2026', bal:10448.66, pay:'F0090', claims:null, claimant:null, narr:null, annot:null},
    {cd:'Debit',  amt:-145.00, type:'Payment',   created:'13/02/2026', bal:9428.66, pay:'P1180', claims:'C-NRP-1180', claimant:'POLNRP-1180', narr:'Water damage repair', annot:null},
    {cd:'Debit',  amt:-155.55, type:'Payment',   created:'12/02/2026', bal:9573.66, pay:'P3302', claims:'C-HJS-3302', claimant:'POLHJS-3302', narr:'Fridge repair claim', annot:null},
    {cd:'Debit',  amt:-149.96, type:'Payment',   created:'11/02/2026', bal:9729.21, pay:'P2291', claims:'C-WGB-2291', claimant:'POLWGB-2291', narr:'Tablet screen fix', annot:null},
    {cd:'Credit', amt:160.45,  type:'Return',    created:'10/02/2026', bal:9879.17, pay:'R7740', claims:'C-WGB-7740', claimant:'POLWGB-7740', narr:'Overpayment refund', annot:null},
    {cd:'Debit',  amt:-174.74, type:'Payment',   created:'08/02/2026', bal:9718.72, pay:'P6654', claims:'C-LDK-6654', claimant:'POLLDK-6654', narr:'Console repair', annot:null},
    {cd:'Debit',  amt:-150.00, type:'Payment',   created:'07/02/2026', bal:9893.46, pay:'P5305', claims:'C-VTM-5305', claimant:'POLVTM-5305', narr:'Washer motor fix', annot:null}
  ];

  // ---- generators for incoming rows ----
  var entryTypes = ['Account Movement', 'Account Movement Fee', 'Refund Of Payment', 'Premium Receipt', 'Cash Call'];
  var ccys = ['GBP', 'USD', 'EUR', 'CAD', 'AUD'];
  var payRefs = ['claim-4471', 'pay batch 09', 'settlement A', 'fcp transfer', 'loss fund top-up', 'bordereaux ref', 'wire 88213', 'TPA payout'];
  var claimRefs = ['CLM-2291', 'CLM-7740', 'check998', 'ref-5521', 'CLM-1180', 'auth-3302'];
  // short insurer names used in Liquidity annotations
  var insurers = ['Aviva', 'Beazley', 'Hiscox', 'Markel', 'Convex', 'Canopius', 'Aegis', 'Tokio', 'Chubb', 'Zurich', 'Argenta', 'Apollo'];
  // Consumer Warranty payment narratives (max 20 chars)
  var warrantyNarr = [
    'Screen repair claim', 'Phone replacement', 'Laptop repair', 'TV panel repair',
    'Battery replacement', 'Water damage repair', 'Fridge repair claim', 'Washer motor fix',
    'Tablet screen fix', 'Accidental damage', 'Camera lens repair', 'Console repair',
    'Headphone replace', 'Dishwasher repair', 'Oven element fix', 'Smartwatch repair',
    'Audio system fix', 'Microwave replace', 'Vacuum motor fix', 'Router replacement'
  ];
  // Return narratives (max 20 chars)
  var returnNarr = [
    'Premium refund', 'Refund issued', 'Policy refund', 'Overpayment refund',
    'Cancellation refund', 'Adjustment refund'
  ];

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function rand(a){ return a[Math.floor(Math.random()*a.length)]; }
  function fmtDate(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
  function digits(n){ var s=''; for(var i=0;i<n;i++) s+=Math.floor(Math.random()*10); return s; }
  function letters(n){ var L='ABCDEFGHJKLMNPRSTUVWXYZ', s=''; for(var i=0;i<n;i++) s+=L[Math.floor(Math.random()*L.length)]; return s; }
  // References keyed off entry type
  function refs(type){
    var num = digits(4), code = letters(3);
    if (type === 'Liquidity') return { pay:'F'+num, claims:null, claimant:null };
    return { pay:(type === 'Return' ? 'R' : 'P')+num, claims:'C-'+code+'-'+num, claimant:'POL'+code+'-'+num };
  }

  var running = seed[0].bal;

  // Start the timeline one month before now, computed at load, so the feed
  // always looks current whenever the animation is opened. Re-date the seed
  // newest-first (row 0 = now − 1 month) and let new rows advance from there.
  var startDate = new Date();
  startDate.setMonth(startDate.getMonth() - 1);
  (function () {
    var d = new Date(startDate.getTime());
    for (var i = 0; i < seed.length; i++) {
      seed[i].created = fmtDate(d);
      d = new Date(d.getTime() - (1 + Math.floor(Math.random() * 3)) * 86400000);
    }
  })();
  var lastDate = new Date(startDate.getTime());

  function makeRow() {
    var roll = Math.random();
    var type, cd, amt;
    if (roll < 0.85) {                                   // Payment ~ -$150 (85%)
      type = 'Payment'; cd = 'Debit';
      amt = -(+(Math.random() * 60 + 120).toFixed(2));  // ~120–180
    } else if (roll < 0.95) {                            // Return ~ +$150 (10%)
      type = 'Return'; cd = 'Credit';
      amt = +(Math.random() * 60 + 120).toFixed(2);     // ~120–180
    } else {                                            // Liquidity ~ +$1,000 (5%)
      type = 'Liquidity'; cd = 'Credit';
      amt = +(Math.random() * 400 + 800).toFixed(2);    // ~800–1200
    }
    running = +(running + amt).toFixed(2);
    lastDate = new Date(lastDate.getTime() + (1 + Math.floor(Math.random()*4)) * 86400000);
    var ccy = rand(ccys);
    var fx = (Math.random()*1.6 + 0.4).toFixed(5);
    var src = +(Math.abs(amt) * (Math.random()*1.5 + 0.6)).toFixed(2);
    var label = type === 'Liquidity' ? 'Liquidity transfer' : type;
    var r = refs(type);
    var narrText = type === 'Payment'
      ? rand(warrantyNarr)
      : type === 'Liquidity'
        ? null
        : rand(returnNarr);
    return {
      cd: cd,
      amt: amt,
      type: type,
      created: fmtDate(lastDate),
      bal: Math.abs(running),
      pay: r.pay,
      claims: r.claims,
      claimant: r.claimant,
      narr: narrText,
      annot: null   // new rows always start un-annotated
    };
  }

  function money(v) {
    return '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function amtCell(v) {
    var cls = v < 0 ? 'neg' : (v > 0 ? 'pos' : '');
    var sign = v > 0 ? '+' : (v < 0 ? '-' : '');
    return '<span class="' + cls + '">' + sign + money(v) + '</span>';
  }
  function txt(v){ return v == null ? '<span class="muted">—</span>' : v; }
  function annotCell(v){ return v == null ? '<span class="muted">Add annotation</span>' : v; }

  function rowHTML(r) {
    return ''
      + '<td class="td-cd"><span class="tag ' + (r.cd === 'Credit' ? 'credit' : 'debit') + '">' + r.cd + '</span></td>'
      + '<td class="right">' + amtCell(r.amt) + '</td>'
      + '<td>' + r.type + '</td>'
      + '<td>' + r.created + '</td>'
      + '<td class="right">' + money(r.bal) + '</td>'
      + '<td>' + txt(r.pay) + '</td>'
      + '<td>' + txt(r.claims) + '</td>'
      + '<td>' + txt(r.claimant) + '</td>'
      + '<td>' + txt(r.narr) + '</td>'
      + '<td>' + annotCell(r.annot) + '</td>'
      + '<td class="td-action"><button class="edit-btn" aria-label="Edit">' + editSvg + '</button></td>';
  }

  function makeTR(r) {
    var tr = document.createElement('tr');
    tr.className = 'entry-row';
    tr.innerHTML = rowHTML(r);
    tr._data = r;   // keep the data so we can annotate this row later
    return tr;
  }

  // ---- annotation text, keyed off entry type ----
  // ISO week number from a dd/mm/yyyy string
  function weekNum(dateStr) {
    var p = dateStr.split('/');
    var d = new Date(+p[2], +p[1] - 1, +p[0]);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    var week1 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  }
  function annotForRow(r) {
    if (r.type === 'Return')    return 'Reconciled';
    if (r.type === 'Liquidity') return 'Reconciled';
    var year = r.created.split('/')[2];
    return 'BDX_' + pad(weekNum(r.created)) + '-' + year;   // Payment + anything else
  }

  // ---- typewriter: type `text` into the annotation cell of a row ----
  function typeAnnotation(tr) {
    var td = tr.children[9];   // annotation column
    if (!td) return;
    td.innerHTML = '<span class="annot-text"></span><span class="annot-caret"></span>';
    var span = td.querySelector('.annot-text');
    var caret = td.querySelector('.annot-caret');
    var text = tr._data.annot;
    var i = 0;
    (function step() {
      // bail out if the row got recycled out of the table mid-type
      if (!td.isConnected) return;
      span.textContent = text.slice(0, ++i);
      if (i < text.length) {
        setTimeout(step, 42 + Math.random() * 46);
      } else {
        setTimeout(function () { if (caret) caret.remove(); }, 420);
      }
    })();
  }

  // pick a random un-annotated row within the top 5 and type one onto it
  function annotateRandomRow() {
    var top = Array.prototype.slice.call(tbody.children, 0, 5);
    var candidates = top.filter(function (tr) {
      return tr._data && tr._data.annot == null && !tr.classList.contains('entering');
    });
    if (!candidates.length) return;
    var tr = rand(candidates);
    tr._data.annot = annotForRow(tr._data);   // commit immediately so it isn't re-picked
    typeAnnotation(tr);
  }

  var tbody = document.getElementById('tbody');
  seed.forEach(function (r) { tbody.appendChild(makeTR(r)); });

  // Pin the clip to the exact height of the visible rows so it never grows
  // when the 11th row is briefly inserted during a tick — this keeps the
  // bottom delimiter perfectly stable.
  var clip = document.querySelector('.tbody-clip');
  var seededH = tbody.offsetHeight;
  ROW_H = seededH / VISIBLE;
  clip.style.height = seededH + 'px';

  // ---- Auto-fit columns ----
  // Measure each column's natural one-line width (header + worst-case content)
  // so nothing truncates, then spread the leftover space evenly across all
  // columns to fill the table. Applied to both the header and body tables so
  // their columns stay aligned (both use table-layout: fixed).
  var headTable = document.querySelectorAll('table.entries')[0];
  var bodyTable = document.querySelectorAll('table.entries')[1];
  var NCOLS = headTable.querySelectorAll('colgroup col').length;
  var NARR_COL = 8;

  function fitColumns() {
    var W = document.querySelector('.table-card').clientWidth;
    if (!W) return;

    // off-screen measuring table collapsed to min-content: headers wrap to their
    // longest word (CSS th = white-space:normal) while data cells stay one line
    // (CSS td = white-space:nowrap), so columns size to the data, not long labels.
    var m = document.createElement('table');
    m.className = 'entries';
    m.style.cssText = 'position:absolute;left:-99999px;top:0;table-layout:auto;width:1px;';
    m.innerHTML = headTable.querySelector('thead').outerHTML;
    var tb = document.createElement('tbody');
    var samples = warrantyNarr.concat(returnNarr).map(function (n) {
      return { cd:'Credit', amt:1200, type:'Liquidity', created:'17/02/2026', bal:10448.66,
               pay:'POLABC-1234', claims:'C-ABC-1234', claimant:'POLABC-1234', narr:n, annot:'Add annotation' };
    });
    samples.forEach(function (s) { var tr = document.createElement('tr'); tr.innerHTML = rowHTML(s); tb.appendChild(tr); });
    m.appendChild(tb);
    document.body.appendChild(m);

    var minW = [];
    var head = m.querySelector('thead tr').children;
    for (var i = 0; i < NCOLS; i++) minW[i] = head[i].offsetWidth;
    m.querySelectorAll('tbody tr').forEach(function (tr) {
      for (var i = 0; i < NCOLS; i++) { var w = tr.children[i].offsetWidth; if (w > minW[i]) minW[i] = w; }
    });
    document.body.removeChild(m);

    minW = minW.map(function (w) { return w + 4; }); // small buffer against sub-pixel clipping

    var sum = minW.reduce(function (a, b) { return a + b; }, 0);
    var add = Math.floor(Math.max(0, W - sum) / NCOLS);
    var finalW = minW.map(function (w) { return w + add; });
    var used = finalW.reduce(function (a, b) { return a + b; }, 0);
    finalW[NARR_COL] += (W - used); // absorb rounding into the narrative column
    if (finalW[NARR_COL] < minW[NARR_COL]) finalW[NARR_COL] = minW[NARR_COL];

    [headTable, bodyTable].forEach(function (t) {
      var cols = t.querySelectorAll('colgroup col');
      for (var i = 0; i < NCOLS; i++) cols[i].style.width = finalW[i] + 'px';
      t.style.width = Math.max(W, finalW.reduce(function (a, b) { return a + b; }, 0)) + 'px';
    });
  }

  fitColumns();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitColumns);
  var fitTimer;
  window.addEventListener('resize', function () { clearTimeout(fitTimer); fitTimer = setTimeout(fitColumns, 150); });


  var animating = false;
  function tick() {
    if (animating) return;
    animating = true;

    var newTR = makeTR(makeRow());
    newTR.classList.add('entering');
    tbody.insertBefore(newTR, tbody.firstChild);

    var exitingTR = tbody.lastElementChild; // old last row — slides + fades out below clip

    // start shifted up by one row so the new row is hidden above the clip
    tbody.style.transition = 'none';
    tbody.style.transform = 'translateY(-' + ROW_H + 'px)';
    // force reflow so the starting transform is committed
    void tbody.offsetHeight;

    // animate down: new row flies in at top, everything pushes down, last exits
    tbody.style.transition = 'transform 620ms cubic-bezier(0.16,1,0.3,1)';
    tbody.style.transform = 'translateY(0)';

    // fade the new row's content in
    requestAnimationFrame(function () {
      newTR.querySelectorAll('td').forEach(function (td) {
        td.style.transition = 'opacity 520ms cubic-bezier(0.16,1,0.3,1) 80ms';
      });
      newTR.classList.remove('entering');
    });

    // fade out the exiting row as it slides past the bottom edge
    exitingTR.querySelectorAll('td').forEach(function (td) {
      td.style.transition = 'opacity 480ms cubic-bezier(0.4,0,0.2,1)';
      td.style.opacity = '0';
    });

    // transitionend on a table-row-group transform is unreliable, so drive
    // cleanup off a fixed timeout matching the 620ms slide duration.
    setTimeout(function () {
      // clean up: drop the row that slid out, reset transform without transition
      tbody.style.transition = 'none';
      tbody.style.transform = 'translateY(0)';
      if (tbody.lastElementChild && tbody.children.length > VISIBLE) {
        tbody.removeChild(tbody.lastElementChild);
      }
      newTR.querySelectorAll('td').forEach(function (td) { td.style.transition = ''; });
      animating = false;
    }, 660);
  }

  // Rows and annotations run on independent clocks.
  // Rows arrive on a steady beat; annotations land on their own slower,
  // randomised schedule — and may type while rows are sliding.
  setInterval(tick, 2000);

  function annotateLoop() {
    annotateRandomRow();
    setTimeout(annotateLoop, 3200 + Math.random() * 4000);   // slower than rows, random
  }
  setTimeout(annotateLoop, 1800 + Math.random() * 1500);
})();
</script>
</body>
</html>
